<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- env.js 불러오기 -->
  <script src="./env.js"></script>
  <style>
    *,
    :after,
    :before {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      background-color: inherit;
      outline: none;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .main {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
    }

    .header button {
      padding: .25rem 2rem;
      font-size: 1rem;
      background-color: #ddd;
      border-radius: 1rem;
    }

    .main .chat {
      width: 100%;
      height: 100%;
      background-color: #ddd;
      border-radius: 1rem;
      padding: 1rem;
    }

    .main .input {
      width: 100%;
      height: 4rem;
      border-radius: 1rem;
      display: flex;
      gap: 1rem;
      font-size: 1.75rem;
    }

    .main .input input {
      background-color: #ddd;
      border-radius: 1rem;
      width: 100%;
      height: 100%;
      padding: 0 1rem;
      font-size: 1.25rem;
    }

    .input button {
      width: 5rem;
      font-size: 1.25rem;
      background-color: #ddd;
      border-radius: 1rem;
    }

    input:focus-within {
      outline: solid .25rem #08f;
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="header">
      <h2>충렬AI</h2>
      <button>리셋</button>
    </div>
    <div class="chat" id="output"></div>
    <div class="input">
      <input id="input" type="text" placeholder="입력">
      <button id="generate">생성</button>
    </div>
  </div>

  <script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    let data = '';
    let dataprompt = '';

    async function generateContent() {
      const outputDiv = document.getElementById('output'); // 1. outputDiv 변수 선언 추가[cite: 1]

      // 2. CONFIG 객체 및 API Key 존재 여부 점검
      const config = window.CONFIG || (typeof CONFIG !== 'undefined' ? CONFIG : null);
      if (!config || !config.API_KEY) {
        outputDiv.textContent = 'Error: CONFIG 또는 API_KEY를 찾을 수 없습니다. env.js가 로드되었는지 확인하세요.';
        console.error("CONFIG is not defined or missing API_KEY");
        return;
      }

      try {
        const genAI = new GoogleGenerativeAI(config.API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-3.5-flash-lite" });

        const presetprompt = '짮게 2문장 이내로 대답해. 너는 충렬고등학교 정보 ai입니다. 학교와 관련된 질문에만 대답하시오, 교실의 위치뿐만 아니라 어느 교실의 옆에 있는지도 말하시오\n학교 정보:\n';
        const prompt = document.getElementById('input').value;

        const result = await model.generateContent(presetprompt + dataprompt + '질문: ' + prompt);
        const response = await result.response;
        const text = response.text();

        outputDiv.textContent = text;
      } catch (error) {
        console.error("Error generating content:", error);
        outputDiv.textContent = 'Error: ' + error.message;
      }
    }

    function parseCSV(csvString) {
      const rows = csvString.split('\n').map(row => row.trim()).filter(row => row.length > 0);

      const data = rows.map(row => {
        const fields = row.match(/(?:[^," Voting"]+|"([^"]*)")+/g);
        return fields.map(field => {
          if (field.startsWith('"') && field.endsWith('"')) {
            return field.substring(1, field.length - 1).replace(/""/g, '"');
          }
          return field;
        });
      });
      return data;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const generateButton = document.getElementById('generate');
      generateButton.addEventListener('click', generateContent);

      fetch('https://raw.githubusercontent.com/CodingChung/schoolAI/refs/heads/main/data.csv')
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok: ' + response.status);
          return response.text();
        })
        .then(text => {
          data = parseCSV(text);

          data.forEach(row => {
            dataprompt += `${row[0]}\n${row[1]}\n\n`;
          });
        })
        .catch(error => {
          console.error('Failed to fetch:', error);
        });

      document.querySelector('input').addEventListener(('keypress'), e => {
        if (e.keyCode == 13) {
          generateButton.click();
        }
      });
    });
  </script>
</body>

</html>
